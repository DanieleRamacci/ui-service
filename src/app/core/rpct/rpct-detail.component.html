<div class="container my-4">
  @if (accessDenied) {
    <it-alert type="danger">
      Non sei autorizzato a visualizzare questa amministrazione.
    </it-alert>
    <button itButton="outline-primary" class="mt-3" (click)="goBack()">
      <it-icon name="arrow-left" size="sm"></it-icon> Torna alla lista
    </button>
  } @else if (codiceIpa) {
    <button itButton="outline-primary" class="mb-3" (click)="goBack()">
      <it-icon name="arrow-left" size="sm"></it-icon> Torna alla lista
    </button>
    <h3>Dettaglio ente: {{ codiceIpa }}</h3>
    <p class="text-muted">Questa pagina verrà completata nel Blocco 4.</p>
  }
</div>
